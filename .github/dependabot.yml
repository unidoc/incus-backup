# Weekly dependency updates, grouped so a week costs few PRs (and few CI runs).
# Majors come as separate PRs: they need reading. Every PR runs the full CI (ci.yml), including the
# vendor job (go mod tidy/vendor) and the web build.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web-crypto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(web-crypto)"
    groups:
      web-crypto-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # the workflows, and the composite actions they use
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
